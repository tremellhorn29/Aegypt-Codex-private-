name: Street Kings combat checks
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  combat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check combat JavaScript
        run: |
          node --check scripts/fight-core.js
          node --check scripts/fighters.js
          node --check scripts/gamepad.js
      - name: Run combat regression tests
        run: node --test tests/fight.test.cjs tests/gamepad.test.cjs
  browser:
    name: iPhone viewport + DualShock smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run mobile fight browser smoke
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/fastln-street-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/browser.cjs
