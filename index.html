<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAST LN Origins — Vertical Slice</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div id="app" class="crt-shell">
    <header class="hud top">
      <div class="panel title">
        <h1>FAST LN ORIGINS</h1>
        <p>STAR (AGE 14) — APARTMENT SESSION</p>
      </div>
      <div class="panel mission">
        <h2>MISSION</h2>
        <p id="missionText">Drop Episode 1: Talk to all crew members.</p>
      </div>
      <div class="panel rep">
        <h2>REPUTATION</h2>
        <p><span id="repValue">0</span> REP</p>
      </div>
    </header>

    <main class="game-wrap panel">
      <div id="camera" class="camera">
        <div id="world" class="world" aria-label="Pixel apartment scene"></div>
      </div>
      <div id="dialogue" class="dialogue hidden">
        <h3 id="speaker">Crew</h3>
        <p id="dialogueText"></p>
      </div>
    </main>

    <footer class="hud bottom">
      <div class="panel controls">WASD: MOVE • E: INTERACT • M: MUSIC</div>
      <button id="musicToggle" class="panel button" type="button">MUSIC: ON</button>
      <div class="panel save">REP auto-saves to local storage.</div>
    </footer>
  </div>

  <script type="module" src="scripts/main.js"></script>
</body>
</html>
